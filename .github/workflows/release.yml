name: "Build & Release Ankhvault Launcher"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: "https://nehtpnrmkipmikutcjbr.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_6eDmlkZxa0YnaWb6KkwRIQ_XtcNVlze"
        with:
          tagName: v__VERSION__
          releaseName: "Ankhvault Launcher v__VERSION__"
          releaseBody: "Automated Release - Download latest launcher build below."
          releaseDraft: false
          prerelease: false
